<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example</title>
    <link rel="icon" href="https://i.pinimg.com/1200x/db/53/c7/db53c72a008309ba9028a4b576830ef5.jpg">
</head>
<body>
    <h1 align="center" style="font-size: 50px; color: blueviolet;"><u>Type</u></h1>
    <hr size="3" color="Green">
    <form action="" style="width:30vw ; height: 60vh; border: 2px solid gray; padding: 20px; border-radius: 15px; margin: auto;">
       <label style="font-size: 20px; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;" for="">Type Text</label>
       <input type="text"><br><br>

       <label style="font-size: 20px; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;" for="">Checkbox</label>
       <input type="checkbox"><br><br>

       <label style="font-size: 20px; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;" for="">Date</label>
       <input type="date"><br><br>

       <label style="font-size: 20px; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;" for="">Type Redio</label>
       <input type="radio"><br><br>

       <label style="font-size: 20px; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;" for="">Type Range</label>
       <input type="range"><br><br>

       <label style="font-size: 20px; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;" for="">Type Date Time</label>
       <input type="datetime"><br><br>

       <label style="font-size: 20px; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;" for="">Type Date time local</label>
       <input type="datetime-local"><br><br>

       <label style="font-size: 20px; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;" for="">Email</label>
       <input type="Email"><br><br>

       <label style="font-size: 20px; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;" for="">Password</label>
       <input type="password"><br><br>

       <label style="font-size: 20px; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;" for="">Type Number</label>
       <input type="number">
    </form>
</body>
</html>
