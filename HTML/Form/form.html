<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Login</title>
    <link rel="icon" href="https://i.pinimg.com/736x/40/1b/14/401b14831220e22a44e41456f55be314.jpg">
    <Title>Login</Title>
</head>
<body>
   <h1 style="text-align: center; color: blue; size: 50px;"><u>Login Form</u></h1> 
   <hr size="3" color="green">
   <form  action="" style="border: 2px solid gray; border-radius: 15px; width: 30vw; height: 60vh; margin: auto; padding: 10px;">
    <h2 align="center" style="color: rgb(85, 98, 245); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 30px;  ">Login</h2>


    <label for="Email">Email</label>
    <input style="width: 96%; height:30px; border-radius: 9px; margin-top: 10px;" type="text" placeholder="Enter Email" >


    <label for="Password">Password</label>
    <input style="width: 96%; height: 30px; border-radius: 9px; margin-top: 10px;" type="text" placeholder="Enter Password">


    <p align="center" style="font-size: 12px;">Remember me to forgot Password</p>
    <button style="width: 98%; border-radius: 20px; height:30px; margin-top: 1px; background-color: blue;">Login</button>
   </form>
</body>
</html>
