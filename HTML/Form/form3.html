<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input</title>
    <link rel="icon" href="https://i.pinimg.com/1200x/fc/0c/7c/fc0c7cdfd43378ba493b05f61f120c7c.jpg">
</head>
<body style="background-image: url(https://i.pinimg.com/1200x/b1/b9/c2/b1b9c230143fb0d8540eabe5b74adf27.jpg); background-size: cover;">
    <h1 align="center" style="color: blue; font-size: 40px;"><u>Personal Information</u></h1>
    <hr size="4" color="Green">
    <form action="" style="width: 30vw; height: 60vh; border:4px solid blue ; border-radius: 15px; margin: 90px auto; padding: 20px; background-color: rgba(28, 184, 83, 0.214); ">
      <fieldset>
        <legend style="font-size: 30px; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">
            Personal Information
        </legend>

        <label style="font-size: 20px; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;" for="">Full Name:</label>
        <input style="width: 98%; height: 35px; border: 1px solid gray; border-radius: 15px; margin-top:10px ; margin-bottom: 10px;" type="text">

        <label style="font-size: 20px; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;" for="">Email:</label>
        <input style="width: 98%; height: 35px; border: 1px solid gray; border-radius: 15px; margin-top:10px ; margin-bottom: 10px;" type="Email">

        <label style="font-size: 20px; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; " for="">Dath of bith</label>
        <input style="width: 98%; height: 35px; border: 1px solid gray; border-radius: 15px; margin-top:10px ; margin-bottom: 10px;" type="datetime-local">

      </fieldset>
      
      <button type="submit" style="height: 40px; width: 100%; border: none; border-radius: 15px; font-size: 20px; margin-top: 30px; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif; background-color: rgb(83, 165, 42);">Submit</button>
      
    </form>
</body>
</html>
