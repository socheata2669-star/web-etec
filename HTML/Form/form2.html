<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="icon" href="https://i.pinimg.com/1200x/89/c1/61/89c161a0986ff427c8e84848119458ab.jpg">
</head>
<body style="background-image: url(https://i.pinimg.com/1200x/d6/a1/08/d6a10899870534728907703fe978be0f.jpg); background-size: cover;">
    <h1 style="text-align: center; color: blue; font-size: 40px;" ><u>Register Form</u></h1>
    <hr size="3" color="green">
    <form action="" style="border: 2px solid rgb(107, 52, 52); border-radius: 15px; width: 30vw; height: 70vh; margin: 30px auto; padding: 20px; background-color: rgba(234, 218, 246, 0.459);">
        <h2 style="text-align: center; color: rgb(58, 111, 167); font-size: 30px;">Register</h2>

        <label style="font-size: 30px;  " for="">User</label><br>
        <input style="width: 98%; height: 30px; border: 1px solid gray; border-radius: 15px; font-size: 20px; margin-top: 10px; margin-bottom: 10px;" type="text" >

        <label style="font-size: 30px; " for="">Email</label><br>
        <input style="width: 98%; height: 30px; border: 1px solid gray; border-radius: 15px; font-size: 20px; margin-top: 10px; margin-bottom: 10px;" type="email" >

        <label style="font-size: 30px; " for="">Password</label><br>
        <input style="width: 98%; height: 30px; border: 1px solid gray; border-radius: 15px; font-size: 20px; margin-top: 10px; margin-bottom: 10px;" type="password" >

        <button style="margin-top: 15px; width: 99%; height: 45px; font-size: 20px; border-radius: 15px; border: 1px solid gray; background-color: rgba(196, 90, 90, 0.508);">Sign Up</button>
        <p style="text-align: center; width: 90vx;">or sign up with </p>

        <button style="width: 99%; height: 40px; font-size: 15px; border-radius: 20px; border: 1px solid rgba(123, 199, 17, 0); background-color: #2e5af9a3; margin-bottom: 20px;">Google</button>

        <button style="width: 99%; height: 40px; font-size: 15px; border-radius: 20px; border: 1px solid gray; background-color: rgba(0, 0, 255, 0.797); ">Facebook</button>
    </form>
</body>
</html>
