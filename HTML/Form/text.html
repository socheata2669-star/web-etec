<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text</title>
    <link rel="icon" href="https://i.pinimg.com/1200x/73/2c/fc/732cfc1b50342c5f31d0d886f2d66082.jpg">
</head>
<body>
    <h1 style="color: blue; text-align: center; font-size: 45px;">Contact</h1>
    <hr size="4" color="green">
    <form action="" style=" font-size: 25px; width: 30vw; height: 70vh; border: 2px solid rgb(7, 7, 7); margin: auto; border-radius: 15px; padding: 20px; background-color: rgba(0, 60, 255, 0.141);" >
        <h2 style="text-align: center; font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">Contact</h2>

        <label style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;" for="">User Name</label>
        <input style="width: 98%; height: 30px; border: 1px solid gray; border-radius: 15px; margin-top: 10px; margin-bottom: 10px; " type="text">

        <label style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;" for="">Email</label>
        <input style="width: 98%; height: 30px; border: 1px solid gray; border-radius: 15px; margin-top: 10px; margin-bottom: 10px; " type="Email">

        <label style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;" for="">Phone Number</label>
        <input style="width: 98%; height: 30px; border: 1px solid gray; border-radius: 15px; margin-top: 10px; margin-bottom: 10px; " type="text">

        <label style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;" for="">Send Message</label>
        <textarea name="" id="" style="width: 98%; height: 80px; font-size: 15px; border: 1px solid gray; border-radius: 5px;"></textarea>

        <button style="width: 99%; height: 30px; border: 2px solid rgb(45, 21, 202); border-radius: 15px; background-color: rgba(0, 76, 255, 0.737); ">Submit</button>


    </form>
</body>
</html>
