<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <link rel="icon" href="https://i.pinimg.com/1200x/0d/eb/9b/0deb9bcbfde06fe13252a9a9f6d777ec.jpg">
</head>
<body>
    <h1 style="text-align: center;color: blueviolet;"><u>Table</u></h1>
    <hr size="3" color="blue">
    <table border="1" style="width: 70%; font-size: 30px;" align="center">
        <thead>
            <tr>
                <th colspan="4">Student</th> 
            </tr>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Gender</th>
                <th>Score</th>
            </tr>
            <tr align="center">
                <td colspan="3">A</td>
                <td>B</td>
            </tr>
            <tr align="center">
                <td rowspan="2">A</td>
                <td>B</td>
                <td colspan="2">C</td>
                <td rowspan="2">D</td>
            </tr>
            <tr align="center">
                <td>E</td>
                <td colspan="2">F</td>
            </tr>
        </thead>
    </table>
</body>
</html>
