<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <link rel="icon" href="https://i.pinimg.com/736x/c2/98/c1/c298c13859ab4163ba7843438eefd384.jpg">
</head>
<body>
    <h1 style="text-align: center;color: blueviolet;"><u>Table</u></h1>
    <hr size="3" color="blue">
    <table align="center" border="1" style="width: 70%; font-size: 30px;" >
        <tr>
            <th colspan="5">List Product</th>
        </tr>
        <tr align="center">
            <td>img</td>
            <td>Name</td>
            <td>Caregory</td>
            <td>Discription</td>
            <td>Price</td>
        </tr>
        <tr align="center">
            <td><img width="150px" src="https://i.pinimg.com/736x/05/56/09/055609fc686791ba58055b7e4743a1ec.jpg" alt=""></td>
            <td>Apple</td>
            <td>Fruit</td>
            <td>An apple is a crisp, nutritious pome fruit produced by the Malus domestica tree.</td>
            <td>2.5$/kg</td>
        </tr>
        <tr align="center">
            <td><img width="150px" src="https://i.pinimg.com/736x/0e/02/fa/0e02fac136406d4df30e35608fb76ed9.jpg" alt=""></td>
            <td>Orange</td>
            <td>Fruit</td>
            <td>An orange is a citrus fruit (botanically a hesperidium, a type of berry) produced by an evergreen tree.</td>
            <td>2.99$/kg</td>
        </tr>
    </table>
</body>
</html>
